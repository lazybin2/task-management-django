{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
    <div class="w-1/2 mx-auto mt-8 p-6 ">
        <div class="div">
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
        </div>
        <form method="POST">
            {% comment %} <input type="text" class="border-4 border-gray-300 w-full rounded-lg shadow-sm focus:border-rose-300" placeholder:"Enter task title" ></input> {% endcomment %}
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-rose-600 px-3 py-2  mt-2 rounded-md">Submit</button> 
        </form>
    </div>
    
</body>
</html>
